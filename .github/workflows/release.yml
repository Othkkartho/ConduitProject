name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Determine Release Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version and check tag
        id: meta
        shell: bash
        run: |
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Failed to read workspace version from Cargo.toml"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists; skipping automatic release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} does not exist yet; triggering release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-assets:
    name: Build Portable Archives (${{ matrix.target_name }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x86_64
          - os: macos-latest
            target_name: macos-arm64
          - os: ubuntu-latest
            target_name: linux-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libudev-dev

      - name: Generate desktop icons
        run: node scripts/generate-icons.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Build release binary
        run: cargo build --release -p conduit-desktop

      - name: Build conduit-manager binary
        run: cargo build --release -p conduit-manager

      - name: Package Windows zip archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target_name }}
        run: |
          $pkg = "conduit-v$($env:VERSION)-$($env:TARGET)"
          $stage = "staging/$pkg"
          New-Item -ItemType Directory -Force -Path $stage, "artifacts" | Out-Null
          Copy-Item "target/release/conduit-desktop.exe" "$stage/conduit.exe"
          Copy-Item "target/release/conduit-manager.exe" "$stage/conduit-manager.exe"
          Copy-Item "README.md", "LICENSE" "$stage/"
          Compress-Archive -Path $stage -DestinationPath "artifacts/$pkg.zip" -Force

      - name: Package macOS .app bundle tar.gz & zip
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target_name }}
        run: |
          PKG="conduit-v${VERSION}-${TARGET}"
          STAGE="staging/${PKG}"
          APP="${STAGE}/Conduit Terminal.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources" artifacts
          cp target/release/conduit-desktop "${APP}/Contents/MacOS/conduit-desktop"
          chmod +x "${APP}/Contents/MacOS/conduit-desktop"
          cp target/release/conduit-manager "${STAGE}/conduit-manager"
          chmod +x "${STAGE}/conduit-manager"
          cp apps/desktop/src-tauri/icons/icon.png "${APP}/Contents/Resources/icon.png"
          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Conduit Terminal</string>
            <key>CFBundleDisplayName</key><string>Conduit Terminal</string>
            <key>CFBundleIdentifier</key><string>dev.conduit.terminal</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>conduit-desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          cp README.md LICENSE "${STAGE}/"
          tar -czf "artifacts/${PKG}.tar.gz" -C staging "${PKG}"
          (cd staging && zip -r -y "../artifacts/${PKG}.zip" "${PKG}")

      - name: Package Linux tar.gz archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target_name }}
        run: |
          PKG="conduit-v${VERSION}-${TARGET}"
          STAGE="staging/${PKG}"
          mkdir -p "${STAGE}" artifacts
          cp target/release/conduit-desktop "${STAGE}/conduit"
          chmod +x "${STAGE}/conduit"
          cp target/release/conduit-manager "${STAGE}/conduit-manager"
          chmod +x "${STAGE}/conduit-manager"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "artifacts/${PKG}.tar.gz" -C staging "${PKG}"

      - name: Upload portable archives
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target_name }}
          path: artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [ prepare, build-assets ]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Build release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = version.replace(/\./g, "\\.");
            const re = new RegExp(`## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`);
            const m = changelog.match(re);
            const section = m ? m[1].trim() : `Conduit ${tag} release.`;
            const usage = [
              "",
              "---",
              "",
              "## 실행 방법 (압축 해제 후 바로 실행)",
              "- **Windows (`x86_64`)**: `conduit-" + tag + "-windows-x86_64.zip` 압축 해제 후 `conduit.exe` 실행 (업데이트 `1` / 제거 `2` -> `y`: `conduit-manager.exe`)",
              "- **macOS (`arm64`)**: `conduit-" + tag + "-macos-arm64.tar.gz` 또는 `.zip` 압축 해제 후 `Conduit Terminal.app` 실행 (최초 실행 시 보안 경고가 뜨면 `xattr -cr \"Conduit Terminal.app\"`, 업데이트/제거: `./conduit-manager`)",
              "- **Linux (`x86_64`)**: `conduit-" + tag + "-linux-x86_64.tar.gz` 압축 해제 후 `./conduit` 실행 (시스템에 `libwebkit2gtk-4.1` 필요, 업데이트/제거: `./conduit-manager`)"
            ].join("\n");
            fs.writeFileSync("release-notes.md", section + "\n" + usage + "\n");
          '
          ls -lh release-assets/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Conduit ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          make_latest: true
